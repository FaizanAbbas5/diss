[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t2t"
version = "0.1.0"
description = "Minimising hallucinations in table-to-text generation (dissertation project)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.56",
    "accelerate>=0.30",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "requests>=2.31",
    "sentencepiece>=0.1.99",
    "protobuf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gpu = ["bitsandbytes>=0.43"]
ui = ["streamlit>=1.49"]
analysis = ["matplotlib>=3.8", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"t2t.factsheet" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
