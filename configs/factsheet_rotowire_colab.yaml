# Fact-sheet arm, real run: frozen LLM, n=300 RotoWire. The first real arm
# comparison of the dissertation, paired against the markdown baseline run
# with the same prompt/split/limit.
# PLACEHOLDER prompt until the W2/W3 battery freezes the baseline prompt —
# update `prompt:` here and in the baseline config together.
name: fs-rw-colab
dataset: rotowire
split: validation
limit: 300
model: Qwen/Qwen2.5-7B-Instruct
quantization: 4bit
prompt: rotowire/faithful_v1
serialisation: factsheet
factsheet_version: v1
max_new_tokens: 320
batch_size: 2
seed: 13
