# Gate 5a: full E2E training on Colab T4. 7B 4-bit NF4, gradient
# checkpointing, effective batch 16. Augmentation twin: arm2_e2e_t4_aug.yaml;
# reference-filtering ablation: arm2_e2e_t4_filtered.yaml.
name: arm2-e2e-t4
dataset: e2e_cleaned
split: train
model: Qwen/Qwen2.5-7B-Instruct
quantization: 4bit
gradient_checkpointing: true
prompt: e2e/faithful_v1   # update when the W2 battery freezes the baseline prompt
variant: replacement
k: 16
d: 256
n_heads: 4
n_layers: 2
qformer_layers: 1
lr: 1.0e-4
warmup_ratio: 0.05
max_steps: 1500
batch_size: 2
grad_accum: 8
aux_weight: 0.3
filter_references: false
max_refs_per_example: 1
max_ref_tokens: 128
checkpoint_every: 100
log_every: 10
seed: 13
