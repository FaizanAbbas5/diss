# Local CPU smoke test: tiny model, 3 examples. Verifies the full
# pipeline (load -> serialise -> prompt -> generate -> eval) end to end.
name: e2e-smoke-cpu
dataset: e2e_cleaned
split: validation
limit: 3
model: Qwen/Qwen2.5-0.5B-Instruct
quantization: none
prompt: e2e/faithful_v1
max_new_tokens: 80
batch_size: 1
seed: 13
