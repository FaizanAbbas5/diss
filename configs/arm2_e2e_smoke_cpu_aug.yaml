# Augmentation-variant twin of arm2_e2e_smoke_cpu.yaml; also the training
# run whose checkpoint anchors the gate-4 random-control generation.
name: arm2-e2e-smoke-cpu-aug
dataset: e2e_cleaned
split: train
limit: 20
model: Qwen/Qwen2.5-0.5B-Instruct
quantization: none
prompt: e2e/faithful_v1
variant: augmentation
k: 16
d: 256
n_heads: 4
n_layers: 2
qformer_layers: 1
lr: 1.0e-4
warmup_ratio: 0.05
max_steps: 50
batch_size: 2
grad_accum: 1
aux_weight: 0.3
filter_references: false
max_refs_per_example: 1
max_ref_tokens: 128
checkpoint_every: 20
log_every: 5
seed: 13
