# Reference-filtering ablation: train the augmentation variant only on
# reference sentences the aligner grounds in the table, removing the
# pressure to imitate extrinsic gold content.
name: arm2-rotowire-hpc-aug-filtered
dataset: rotowire
split: train
model: Qwen/Qwen2.5-7B-Instruct
quantization: 4bit
gradient_checkpointing: true
prompt: rotowire/faithful_v1
variant: augmentation
k: 16
d: 256
n_heads: 4
n_layers: 2
qformer_layers: 1
lr: 1.0e-4
warmup_ratio: 0.05
max_steps: 2000
batch_size: 1
grad_accum: 16
aux_weight: 0.3
filter_references: true
max_refs_per_example: 1
max_ref_tokens: 512
checkpoint_every: 100
log_every: 10
seed: 13
