<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family="Segoe UI, system-ui, sans-serif">
<style>
.b-data{fill:#F0F3F7;stroke:#97A2B2;stroke-width:1.5}.b-det{fill:#E4F1EC;stroke:#3E8371;stroke-width:1.5}.b-froz{fill:#E4EDF8;stroke:#4472A3;stroke-width:1.5}.b-trn{fill:#FBEBDD;stroke:#C2703B;stroke-width:1.5}.b-eval{fill:#EFE9F2;stroke:#8B6F98;stroke-width:1.5}.cut{stroke:#4472A3;stroke-width:1.3;stroke-dasharray:2 5}.ar{stroke:#6A7482;stroke-width:1.6;fill:none}.ah{fill:#6A7482}text{fill:#1C2430}.t-ti{font-size:13.5px;font-weight:600}.t-su{font-size:11px;fill:#5B6675}.t-mo{font-family:Consolas,monospace;font-size:10.5px;fill:#5B6675}.t-no{font-size:11.5px;font-style:italic;fill:#5B6675}.t-la{font-size:10px;font-weight:600;letter-spacing:.12em;fill:#5B6675}
</style>
<defs><marker id="ah4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L8 4 L0 8 z"/></marker></defs>
<rect class="b-data" x="10" y="250" width="110" height="80" rx="9"/>
<text class="t-ti" x="65" y="285" text-anchor="middle">Table</text>
<text class="t-su" x="65" y="302" text-anchor="middle">one game / MR</text>
<path class="ar" d="M120 290 L144 290 L144 102 L164 102" marker-end="url(#ah4)"/>
<path class="ar" d="M120 290 L164 290" marker-end="url(#ah4)"/>
<path class="ar" d="M120 290 L144 290 L144 462 L164 462" marker-end="url(#ah4)"/>
<text class="t-la" x="170" y="58">ARM 1 · BASELINE</text>
<rect class="b-det" x="170" y="70" width="300" height="64" rx="9"/>
<text class="t-ti" x="320" y="96" text-anchor="middle">Raw markdown serialisation</text>
<text class="t-su" x="320" y="113" text-anchor="middle">the table, verbatim</text>
<text class="t-la" x="170" y="246">FACT-SHEET ARM · DETERMINISTIC</text>
<rect class="b-det" x="170" y="258" width="300" height="64" rx="9"/>
<text class="t-ti" x="320" y="284" text-anchor="middle">Derive · select · render sheet</text>
<text class="t-su" x="320" y="301" text-anchor="middle">facts.py → policy v1 → Jinja</text>
<text class="t-la" x="170" y="418">ARM 2 · LEARNED</text>
<rect class="b-trn" x="170" y="430" width="300" height="64" rx="9"/>
<text class="t-ti" x="320" y="456" text-anchor="middle">Encoder → projector → k=16 soft tokens</text>
<text class="t-su" x="320" y="473" text-anchor="middle">2.94M trained params · repl / aug / random</text>
<line class="cut" x1="520" y1="44" x2="520" y2="524"/>
<text class="t-la" x="540" y="58">HELD CONSTANT ACROSS ARMS</text>
<path class="ar" d="M470 102 L520 102 L520 196 L554 196" marker-end="url(#ah4)"/>
<path class="ar" d="M470 290 L520 290 L520 212 L554 212" marker-end="url(#ah4)"/>
<path class="ar" d="M470 462 L520 462 L520 228 L554 228" marker-end="url(#ah4)"/>
<rect class="b-froz" x="560" y="180" width="210" height="64" rx="9"/>
<text class="t-ti" x="665" y="204" text-anchor="middle">Same frozen prompt</text>
<text class="t-su" x="665" y="221" text-anchor="middle">{table} slot = the only variable</text>
<line class="ar" x1="665" y1="244" x2="665" y2="272" marker-end="url(#ah4)"/>
<rect class="b-froz" x="560" y="278" width="210" height="64" rx="9"/>
<text class="t-ti" x="665" y="302" text-anchor="middle">Frozen LLM</text>
<text class="t-su" x="665" y="319" text-anchor="middle">Qwen2.5-7B · 4-bit · greedy · seeded</text>
<line class="ar" x1="665" y1="342" x2="665" y2="384" marker-end="url(#ah4)"/>
<rect class="b-data" x="560" y="390" width="210" height="56" rx="9"/>
<text class="t-ti" x="665" y="413" text-anchor="middle">Three summaries</text>
<text class="t-su" x="665" y="430" text-anchor="middle">same items, paired by id</text>
<path class="ar" d="M770 418 L800 418 L800 215 L824 215" marker-end="url(#ah4)"/>
<rect class="b-eval" x="830" y="120" width="238" height="190" rx="9"/>
<text class="t-ti" x="949" y="146" text-anchor="middle">Shared eval suite</text>
<text class="t-su" x="846" y="172">numbers — existence, tiered</text>
<text class="t-su" x="846" y="192">relations — RG-lite, deterministic †</text>
<text class="t-su" x="846" y="212">NLI claims — qualitative support</text>
<text class="t-su" x="846" y="232">PARENT — literature anchor</text>
<text class="t-su" x="846" y="252">seq-logprob — uncertainty signal</text>
<text class="t-mo" x="846" y="280">t2t/eval/ · run_eval.py</text>
<line class="ar" x1="949" y1="310" x2="949" y2="344" marker-end="url(#ah4)"/>
<rect class="b-eval" x="830" y="350" width="238" height="96" rx="9"/>
<text class="t-ti" x="949" y="376" text-anchor="middle">Verdicts</text>
<text class="t-su" x="846" y="400">paired stats — Wilcoxon · bootstrap CIs</text>
<text class="t-su" x="846" y="420">manual annotation — ground truth (W3)</text>
<text class="t-no" x="10" y="560">Everything right of the dashed line is identical for every arm — model, prompt, decoding, items, metrics — so any difference in the verdicts is attributable to the preparation.</text>
<text class="t-no" x="10" y="580">† relations shares facts.py derivations with the fact-sheet arm; mitigations: property tests, W3 sheet audit, and NLI / PARENT / manual labels as code-independent arbiters.</text>
</svg>
